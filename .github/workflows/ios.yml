name: iOS unsigned IPA

# The 70–80 MB site is NOT in the repo. It is fetched from a GitHub Release asset
# named site.zip (built with make_site_zip.sh) and unpacked into Resources/site/.
#
#   gh workflow run ios.yml -f site_release_tag=v1.0.0
#   git tag v1.0.0 && git push --tags      # tag build also resolves site.zip
#
# site.zip resolution order:
#   1. workflow_dispatch input  site_zip_url  (direct link)
#   2. release asset  <tag>/site.zip   for site_release_tag / the pushed tag / "latest"
#   3. repository-local site.zip (git-ignored, last resort)

on:
  workflow_dispatch:
    inputs:
      site_release_tag:
        description: "Release tag that carries site.zip (empty = latest release)"
        required: false
        default: ""
      site_zip_url:
        description: "Direct URL of site.zip (overrides site_release_tag)"
        required: false
        default: ""
      bundle_id:
        description: "CFBundleIdentifier override"
        required: false
        default: "com.pokebonk.offline"
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/Info.plist"
      - "Resources/Assets.xcassets/**"
      - "project.yml"
      - "make_ipa.sh"
      - ".github/workflows/ios.yml"

permissions:
  contents: read        # reading release assets needs nothing more

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: PokeBonk
  SCHEME: PokeBonk
  APP_NAME: PokeBonk.app
  IPA_NAME: PokeBonk-unsigned.ipa
  CONFIGURATION: Release
  BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.pokebonk.offline' }}

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          # xcodegen emits objectVersion 77 (Xcode 16 format). Xcode 15 cannot read
          # it, so pick the newest Xcode that is actually installed and refuse to
          # continue if it is older than 16.
          newest="$(ls -d /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$newest" ]; then
            newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          fi
          [ -n "$newest" ] || { echo "::error::no Xcode found"; exit 1; }
          echo "using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          major="$(xcodebuild -version | sed -n 's/^Xcode *\([0-9]*\).*/\1/p')"
          [ "${major:-0}" -ge 16 ] || { echo "::error::Xcode ${major} is too old for objectVersion 77"; exit 1; }
          xcodebuild -showsdks | grep -E "iphoneos"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      # ── Site cache ─────────────────────────────────────────────────────────
      # Resolving + unpacking site.zip costs ~40–60 s. Cache the *unpacked* tree
      # under a key derived from the zip's content hash, so a re-run with the same
      # build (mvbn8pvw / mvekcp7c / …) restores it instantly and a new build
      # never hits a stale entry.
      - name: Restore site check (cache key)
        id: sitekey
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.site_release_tag }}
          INPUT_URL: ${{ github.event.inputs.site_zip_url }}
        run: |
          set -euo pipefail
          # Cheap probe: fetch only the release asset's digest, not the bytes.
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          [ -n "$TAG" ] || TAG="latest"
          DIGEST=""
          if [ -z "${INPUT_URL}" ]; then
            # Resolve "latest" to a concrete tag first: the /releases/tags/latest
            # endpoint does not exist.
            if [ "$TAG" = "latest" ]; then
              TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
            fi
            if [ -n "$TAG" ]; then
              DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                --jq '.assets[] | select(.name=="site.zip") | .digest' 2>/dev/null || true)
            fi
          fi
          # Fall back to the tag itself when the digest is unavailable (older GH).
          KEY="${DIGEST:-tag-${TAG:-none}}"
          KEY=$(printf '%s' "$KEY" | tr -c 'a-zA-Z0-9._-' '-')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "site cache key: $KEY (release: ${TAG:-n/a})"

      - name: Restore Resources/site
        id: sitecache
        uses: actions/cache/restore@v4
        with:
          path: Resources/site
          key: pokebonk-site-${{ steps.sitekey.outputs.key }}
          restore-keys: |
            pokebonk-site-

      # ── Site resources: site.zip from a Release asset ─────────────────────
      # Download strategy, most reliable first:
      #   1. explicit URL input
      #   2. GitHub REST API asset endpoint with Accept: application/octet-stream
      #      (works for public and private repos, immune to the release-page
      #      redirect that `gh release download` occasionally 404s on)
      #   3. the browser download URL
      #   4. a repository-local site.zip
      # Every attempt is retried: a release created moments earlier can still be
      # propagating.
      - name: Resolve site.zip
        id: site
        if: steps.sitecache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.site_release_tag }}
          INPUT_URL: ${{ github.event.inputs.site_zip_url }}
          TAG_HINT: ${{ steps.sitekey.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          ZIP="$RUNNER_TEMP/site/site.zip"
          REPO="$GITHUB_REPOSITORY"
          TAG="${INPUT_TAG:-${TAG_HINT:-}}"
          [ -n "$TAG" ] || TAG="latest"

          try_get() {           # try_get <url> [auth]
            local url="$1" auth="${2:-}"
            for attempt in 1 2 3 4 5; do
              if [ -n "$auth" ]; then
                curl -fsSL --retry 2 --retry-delay 3 --max-time 600 \
                     -H "Authorization: Bearer ${auth}" \
                     -H "Accept: application/octet-stream" \
                     -o "$ZIP" "$url" && return 0
              else
                curl -fsSL --retry 2 --retry-delay 3 --max-time 600 \
                     -o "$ZIP" "$url" && return 0
              fi
              echo "attempt ${attempt} failed for ${url}; sleeping $((attempt * 3))s"
              sleep $((attempt * 3))
            done
            return 1
          }

          is_zip() { [ -s "$ZIP" ] && [ "$(head -c 2 "$ZIP")" = "PK" ]; }

          ASSET_ID=""
          if [ -n "${INPUT_URL}" ]; then
            echo "== 1. direct URL ${INPUT_URL}"
            try_get "${INPUT_URL}" && is_zip && { echo "zip=$ZIP" >> "$GITHUB_OUTPUT"; exit 0; }
          fi

          # Resolve the tag, then the asset id, via the API.
          if [ -z "${INPUT_TAG}" ]; then
            if [ "$TAG" = "latest" ]; then
              TAG=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
            fi
            if [ -n "${TAG:-}" ]; then
              ASSET_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" \
                --jq '.assets[] | select(.name=="site.zip") | .id' 2>/dev/null || true)
            else
              ASSET_ID=$(gh api "repos/${REPO}/releases" \
                --jq '[.[] | .assets[] | select(.name=="site.zip")][0].id' 2>/dev/null || true)
            fi
          fi

          if [ -n "${ASSET_ID}" ]; then
            echo "== 2. API asset endpoint (id=${ASSET_ID})"
            if try_get "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}" "${GH_TOKEN}"; then
              if is_zip; then echo "zip=$ZIP" >> "$GITHUB_OUTPUT"; exit 0; fi
            fi
          fi

          if [ -n "${TAG:-}" ]; then
            echo "== 3. browser download URL (tag=${TAG})"
            if try_get "https://github.com/${REPO}/releases/download/${TAG}/site.zip"; then
              if is_zip; then echo "zip=$ZIP" >> "$GITHUB_OUTPUT"; exit 0; fi
            fi
          fi

          echo "== 4. repository-local site.zip"
          if [ -f site.zip ] && cp site.zip "$ZIP" && is_zip; then
            echo "zip=$ZIP" >> "$GITHUB_OUTPUT"; exit 0
          fi

          ls -l "$ZIP" 2>/dev/null || true
          echo "::error::site.zip not found. Attach site.zip to a Release (make_site_zip.sh) and re-run with site_release_tag=<tag>."
          exit 1

      - name: Unpack site into Resources/site
        if: steps.sitecache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZIP="${{ steps.site.outputs.zip }}"
          rm -rf Resources/site
          mkdir -p Resources/site
          unzip -q "$ZIP" -d Resources/site
          # Tolerate archives that keep a top-level "site/" folder.
          if [ ! -f Resources/site/index.html ] && [ -f Resources/site/site/index.html ]; then
            shopt -s dotglob
            mv Resources/site/site/* Resources/site/
            rmdir Resources/site/site
          fi
          test -f Resources/site/index.html
          test -f Resources/site/bridge.js
          test "$(wc -c < Resources/site/bridge.js)" -gt 10000
          if grep -q '__bridge.js' Resources/site/index.html; then
            echo "::error::index.html still references the Android-only /__bridge.js"
            exit 1
          fi
          echo "site files: $(find Resources/site -type f | wc -l)"
          du -sh Resources/site

      - name: Save site cache
        if: steps.sitecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Resources/site
          key: pokebonk-site-${{ steps.sitekey.outputs.key }}

      # Sanity check that runs on both cache hit and miss: a corrupted or
      # incomplete restore must fail here, not inside the app.
      - name: Verify site tree
        run: |
          set -euo pipefail
          test -f Resources/site/index.html
          test -f Resources/site/bridge.js
          test "$(wc -c < Resources/site/bridge.js)" -gt 10000
          if grep -q '__bridge.js' Resources/site/index.html; then
            echo "::error::index.html still references the Android-only /__bridge.js"
            exit 1
          fi
          # Every hashed JS/CSS chunk referenced by index.html must exist.
          missing=0
          while read -r a; do
            [ -f "Resources/site/$a" ] || { echo "missing $a"; missing=$((missing+1)); }
          done < <(grep -oE '\./assets/[A-Za-z0-9._-]+\.(js|css)' Resources/site/index.html | sed 's#^\./##' | sort -u)
          [ "$missing" -eq 0 ] || { echo "::error::$missing chunk(s) missing"; exit 1; }
          echo "site tree ok: $(find Resources/site -type f | wc -l) files"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # ── Build cache ────────────────────────────────────────────────────────
      # Second layer: incremental compile state. Keyed on Swift/yml changes, so
      # an unrelated re-run restores the object files and only relinks.
      - name: Restore build products
        id: buildcache
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            ~/Library/Developer/Xcode/DerivedData
          key: pokebonk-build-${{ hashFiles('Sources/**', 'project.yml', 'Config/**', 'Resources/Info.plist') }}
          restore-keys: |
            pokebonk-build-

      - name: Build (unsigned)
        env:
          # Required checks (site present, index.html present) always run in the script;
          # this only skips its reference scan, which CI did above.
          SKIP_SITE_CHECK: "1"
          MARKETING_VERSION: "1.0.0"
          BUILD_NUMBER: ${{ github.run_number }}
        run: /bin/bash ./make_ipa.sh

      - name: Save build products
        if: steps.buildcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build
            ~/Library/Developer/Xcode/DerivedData
          key: pokebonk-build-${{ hashFiles('Sources/**', 'project.yml', 'Config/**', 'Resources/Info.plist') }}

      - name: Smoke-test the app bundle
        run: |
          set -euo pipefail
          APP="build/$APP_NAME"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          lipo -info "$APP/PokeBonk"
          # A signed bundle here means the flags did not take effect: fail loudly.
          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo "::error::app bundle is signed; expected an unsigned build"
            codesign -dv "$APP" || true
            exit 1
          fi
          # Every file of the unpacked site must have been copied into the bundle.
          # NOTE: the runner volume is case-insensitive, so this does NOT prove case
          # correctness for the device; AssetSchemeHandler rejects wrong-case lookups
          # at runtime instead (see README 6.3).
          ( cd Resources/site && find . -type f -print | sort ) > "$RUNNER_TEMP/expected.txt"
          ( cd "$APP/site"     && find . -type f -print | sort ) > "$RUNNER_TEMP/actual.txt"
          missing=$(comm -23 "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt" | head -20)
          if [ -n "$missing" ]; then
            echo "::error::files lost during resource copy:"; echo "$missing"; exit 1
          fi

      - name: Verify ipa layout
        run: |
          set -euo pipefail
          # make_ipa.sh produced build/PokeBonk-unsigned.ipa; verify the structure
          # the same way a sideloader does: Payload/PokeBonk.app/{Info.plist,PokeBonk,PkgInfo,site/}.
          IPA="build/$IPA_NAME"
          test -f "$IPA"
          for entry in \
              "Payload/$APP_NAME/Info.plist" \
              "Payload/$APP_NAME/PokeBonk" \
              "Payload/$APP_NAME/PkgInfo" \
              "Payload/$APP_NAME/site/index.html" \
              "Payload/$APP_NAME/site/bridge.js"; do
            unzip -l "$IPA" | awk '{print $4}' | grep -qx "$entry" \
              || { echo "::error::ipa is missing $entry"; exit 1; }
          done
          ls -lh "$IPA"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: PokeBonk-unsigned-ipa
          path: |
            build/PokeBonk-unsigned.ipa
            build/PokeBonk-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0        # already a zip
          retention-days: 30

      - name: Upload dSYM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokeBonk-dSYM
          path: build/DerivedData/Build/Products/${{ env.CONFIGURATION }}-iphoneos/*.dSYM
          if-no-files-found: warn
          retention-days: 7
